services:
  postgres:
    image: postgres:16-alpine
    container_name: employee_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: employeedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - employee_pgdata:/var/lib/postgresql/data

volumes:
  employee_pgdata:
