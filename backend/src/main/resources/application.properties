# Server Configuration
server.port=8080

# Application Name
spring.application.name=crudl-jwt-app

# PostgreSQL Database Configuration (Docker container: employee_postgres on port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/employeedb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=password

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (256-bit Hex Secret for HS256)
jwt.secret=9a4f2c8d3b7a1e6f5c8d2b4a7e9f1c3d5b7a9e1f3c5d7b9a2e4f6c8d0b2a4e6f
jwt.expiration=86400000
